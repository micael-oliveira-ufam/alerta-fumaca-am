# Sobe o banco (PostgreSQL 16), a API, o painel e o túnel da Cloudflare.
#
#   cp .env.example .env        # ajuste as senhas e o ADMIN_TOKEN
#   docker compose up -d --build
#   curl http://localhost:8000/health        # API (só neste computador)
#   abra http://localhost:8080               # painel em tempo real (só neste computador)
#
# Link público aleatório: o serviço `tunnel` (profile "tunnel", ligado por padrão pelo
# COMPOSE_PROFILES do .env.example) abre um túnel rápido da Cloudflare para a API. O link
# *.trycloudflare.com é sorteado a cada início e aparece no painel, com QR code. O painel NÃO
# passa pelo túnel. Já o link do túnel abre o PAINEL PÚBLICO (dados agregados, sem senha) em `/`. Para desligar o túnel, deixe COMPOSE_PROFILES vazio no .env.
#
# O banco NÃO é publicado no host (só a API e o painel enxergam o Postgres, pela rede interna).
# Os dados ficam no volume `pgdata`; `docker compose down` mantém os dados,
# `docker compose down -v` APAGA tudo.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alerta}
      POSTGRES_USER: ${POSTGRES_USER:-alerta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alerta_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-alerta}
      POSTGRES_USER: ${POSTGRES_USER:-alerta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alerta_dev}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      INPE_CACHE_SECONDS: ${INPE_CACHE_SECONDS:-300}
      FOCOS_PREAQUECER: ${FOCOS_PREAQUECER:-true}
      # Segunda fonte de focos (NASA FIRMS). Vazia = só o INPE. A chave fica no .env, nunca no repositório.
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      INPE_WFS_URL: ${INPE_WFS_URL:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      MIN_RESPOSTAS_PUBLICAS: ${MIN_RESPOSTAS_PUBLICAS:-0}
      MIN_RESPOSTAS_CELULA: ${MIN_RESPOSTAS_CELULA:-1}
      GEOCODER_ATIVO: ${GEOCODER_ATIVO:-true}
      GEOCODER_CONTATO: ${GEOCODER_CONTATO:-micael.oliveira@ufam.edu.br}
      # Atrás do túnel, o IP real vem no cabeçalho CF-Connecting-IP. Só é seguro porque a
      # porta da API fica em 127.0.0.1 (API_BIND): ninguém de fora alcança a API sem o túnel.
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-true}
      # Download do app e QR code do painel público (a pasta dist/ é gerada por tool/gerar_apk.sh).
      PUBLIC_URL: ${PUBLIC_URL:-}
      APK_DIR: /srv/dist
      APP_VERSAO_MINIMA: ${APP_VERSAO_MINIMA:-}
      QUALIDADE_AR_ATIVA: ${QUALIDADE_AR_ATIVA:-true}
      QUALIDADE_AR_CACHE_SECONDS: ${QUALIDADE_AR_CACHE_SECONDS:-1800}
    volumes:
      - ./dist:/srv/dist:ro
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"

  # Painel de acompanhamento (interface web). Mesma imagem da API, outro processo e outra porta.
  painel:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.painel:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-alerta}
      POSTGRES_USER: ${POSTGRES_USER:-alerta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alerta_dev}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MIN_RESPOSTAS_PUBLICAS: ${MIN_RESPOSTAS_PUBLICAS:-0}
      MIN_RESPOSTAS_CELULA: ${MIN_RESPOSTAS_CELULA:-1}
      GEOCODER_ATIVO: ${GEOCODER_ATIVO:-true}
      GEOCODER_CONTATO: ${GEOCODER_CONTATO:-micael.oliveira@ufam.edu.br}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      TUNNEL_METRICS_URL: http://tunnel:2000
      PUBLIC_URL: ${PUBLIC_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      # Só neste computador. Para acessar de fora, use um túnel/VPN com autenticação; nunca
      # publique o painel sem ADMIN_TOKEN e sem HTTPS.
      - "127.0.0.1:${PAINEL_PORT:-8080}:8080"

  # Túnel rápido da Cloudflare: sorteia um link https://<palavras>.trycloudflare.com para a API.
  # Sem conta. O link muda quando este contêiner reinicia. O endpoint de métricas informa o
  # link atual ao painel. Atenção: a Cloudflare descreve os túneis rápidos como para testes
  # (sem garantia de disponibilidade); para uso contínuo prefira um túnel nomeado (README).
  tunnel:
    image: cloudflare/cloudflared:2026.10.2
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - api
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://api:8000"]

  # Túnel NOMEADO da Cloudflare, para o domínio fixo (ex.: respirar-amazonas.cloud). Exige conta
  # Cloudflare com o domínio adicionado e um túnel criado no painel (Zero Trust > Networks >
  # Tunnels), com uma rota publicada para o serviço http://api:8000. O TUNNEL_TOKEN vem desse
  # painel. `tool/iniciar_servidor.sh` liga este serviço sozinho quando há TUNNEL_TOKEN.
  tunnel_dominio:
    image: cloudflare/cloudflared:2026.10.2
    profiles: ["dominio"]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]

volumes:
  pgdata:
