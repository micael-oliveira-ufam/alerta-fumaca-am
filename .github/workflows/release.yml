name: Release

# Publica um release com o APK quando uma tag vX.Y.Z é enviada (ex.: git tag v1.0.0 && git push --tags).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para (re)publicar, ex.: v1.0.0'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  apk:
    name: Compilar e publicar o APK
    runs-on: ubuntu-latest
    steps:
      - name: Definir a tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
      - name: Conferir que a tag bate com a versão do pubspec.yaml
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          test "v$V" = "${{ steps.tag.outputs.name }}" || { echo "pubspec.yaml está em v$V, mas a tag é ${{ steps.tag.outputs.name }}"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Preparar plataforma, permissões e dependências
        run: |
          flutter create --platforms=android,ios --org br.ufam.fcf --project-name alerta_fumaca_am .
          rm -f test/widget_test.dart
          python3 tool/apply_platform_config.py
          python3 tool/apply_platform_config.py --check
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - run: flutter test
      - name: Compilar o APK
        run: |
          API_ARG=""
          if [ -n "${{ vars.API_BASE_URL }}" ]; then API_ARG="--dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}"; fi
          flutter build apk --release $API_ARG
      - name: Nomear o arquivo e gerar SHA-256
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/alerta-fumaca-am-${{ steps.tag.outputs.name }}.apk"
          cd dist && sha256sum *.apk | tee SHA256SUMS.txt
      - name: Criar ou atualizar o release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          NOTES="APK Android (instalação manual). Assinado com a chave de depuração do Flutter: serve para testes e distribuição direta, NÃO para a Play Store. Confira o SHA-256 em SHA256SUMS.txt. Sem API_BASE_URL configurada, o app roda em modo local (nenhuma resposta é enviada a servidor)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Alerta Fumaça AM $TAG" --notes "$NOTES"
          fi
