name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  server:
    name: Servidor (pytest em SQLite e PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alerta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d alerta_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements-dev.txt
      - name: pytest (SQLite em memória)
        working-directory: server
        run: python -m pytest -q
      - name: pytest (PostgreSQL 16 real)
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/alerta_test
        run: python -m pytest -q

  docker:
    name: Docker Compose (sobe banco + API e testa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir com a configuração padrão do README
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Aguardar a API ficar saudável
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health >/dev/null; then echo "API pronta após ${i} tentativas"; exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Teste de fumaça (grava 1 registro de teste)
        run: bash tool/smoke_test_api.sh http://localhost:8000
      - name: Dados persistem após reiniciar a API
        run: |
          docker compose restart api
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health >/dev/null && break; sleep 2; done
          curl -fsS "http://localhost:8000/estatisticas?dias=30" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['total_respostas']==1, d; print('persistiu:', d['total_respostas'])"
      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar e apagar volumes
        if: always()
        run: docker compose down -v

  tools:
    name: Script de permissões (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tool/test_apply_platform_config.py -v

  app:
    name: App Flutter (análise, testes e APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Versões usadas
        run: flutter --version
      - name: Gerar pastas de plataforma (android/ e ios/)
        run: |
          flutter create --platforms=android,ios --org br.ufam.fcf --project-name alerta_fumaca_am .
          rm -f test/widget_test.dart
      - name: Conferir que o flutter create não alterou o código do app
        run: git diff --exit-code -- lib pubspec.yaml assets
      - name: Aplicar permissões (INTERNET, localização, discagem)
        run: |
          python3 tool/apply_platform_config.py
          python3 tool/apply_platform_config.py --check
      - run: flutter pub get
      - name: Ícones e splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Análise estática
        run: flutter analyze
      - name: Testes
        run: flutter test
      - name: Compilar APK de release
        run: |
          API_ARG=""
          if [ -n "${{ vars.API_BASE_URL }}" ]; then API_ARG="--dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}"; fi
          flutter build apk --release $API_ARG
      - name: Conferir permissões no APK compilado
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee /tmp/perms.txt
          for p in INTERNET ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            grep -q "android.permission.$p" /tmp/perms.txt || { echo "FALTA $p no APK"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: alerta-fumaca-am-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
